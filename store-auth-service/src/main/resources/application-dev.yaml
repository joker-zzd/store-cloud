server:
  port: 7000

spring:
  application:
    name: auth-service
  config:
    import: optional:nacos:${spring.application.name}.yaml
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/store?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: 1234
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      timeout: 3s
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yaml
    openfeign:
      client:
        config:
          default:
            connect-timeout: 3000
            read-timeout: 5000
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema-auth.sql

store:
  security:
    jwt:
      secret: store-cloud-auth-refresh-secret-key-2026-demo
      access-ttl: 7d
      refresh-ttl: 7d

springdoc:
  api-docs:
    path: /auth/v3/api-docs
  swagger-ui:
    enabled: false

mybatis-plus:
  mapper-locations: classpath*:com/store/mapper/*.xml
  type-aliases-package: com.store.domain